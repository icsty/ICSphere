<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="preload" as="image" href="/brand/icsphere-wordmark.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="/theme.js"></script>
    <style>
      html { scrollbar-gutter: stable; }
      html:has(.boot-splash) { overflow: hidden; }
      #root { isolation: isolate; }
      .boot-splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; isolation: isolate; overflow-y: auto; padding: 32px; text-align: center; background: var(--surface, Canvas); color: var(--foreground, CanvasText); font-family: var(--font-family-sans, 'Hanken Grotesk', system-ui, sans-serif); opacity: 1; will-change: opacity; transition: opacity 700ms cubic-bezier(.4, 0, .2, 1); }
      .boot-splash-content { width: min(100%, 440px); margin-block: auto; }
      /* Critical wordmark presentation is available before the React stylesheet. */
      .boot-brand { position: relative; mix-blend-mode: lighten; }
      .boot-wordmark { position: relative; display: block; width: min(360px, 100%); aspect-ratio: 1510 / 334; margin-inline: auto; overflow: hidden; }
      .boot-wordmark img { position: absolute; display: block; width: 135.63%; max-width: none; height: auto; left: -17.88%; top: -61.38%; }
      .boot-brand-shimmer { mask-image: linear-gradient(-60deg, transparent 28%, rgb(0 0 0 / .08) 36%, rgb(0 0 0 / .3) 44%, rgb(0 0 0 / .75) 48%, black 50%, rgb(0 0 0 / .75) 52%, rgb(0 0 0 / .3) 56%, rgb(0 0 0 / .08) 64%, transparent 72%); mask-size: 200% 100%; mask-position: 150% 0; mask-repeat: no-repeat; }
      .boot-splash-playing .boot-brand-shimmer { animation: boot-brand-shimmer 2800ms cubic-bezier(.45, 0, .55, 1) 180ms 1 both; }
      @keyframes boot-brand-shimmer { from { mask-position: 150% 0; } to { mask-position: -75% 0; } }
      .boot-splash p { max-width: 360px; margin: 24px auto 0; font-size: 13px; line-height: 1.6; color: var(--secondary-foreground, CanvasText); }
      .boot-splash [data-boot-message] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; font-size: 12px; color: var(--muted-foreground, CanvasText); }
      .boot-splash-error [data-boot-message] { position: static; width: auto; height: auto; overflow: visible; clip-path: none; white-space: normal; margin-top: 24px; }
      .boot-splash-ready { opacity: 0; }
      .boot-splash-ready .boot-brand-shimmer { visibility: hidden; }
      .boot-splash button { margin: 24px auto 0; padding: 8px 16px; border: 1px solid var(--border, CanvasText); border-radius: 8px; background: var(--surface, Canvas); color: var(--foreground, CanvasText); font: inherit; cursor: pointer; }
      .boot-splash button:focus-visible { outline: 2px solid var(--primary, Highlight); outline-offset: 4px; }
      @media (max-width: 700px) { .boot-wordmark { width: min(280px, 100%); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash, #root { transition: none; } .boot-splash .boot-brand-shimmer { opacity: 1; animation: none; mask-image: none; } }
    </style>
    <script src="/boot.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <meta name="description" content="ICSphere is a student-developed academic portal for RTU ICS BSIT students, bringing schedules, department updates, and academic guidance together." />
    <title>ICSphere — Student portal</title>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-live="polite" aria-atomic="true">
      <div class="boot-splash-content">
        <div class="boot-brand" role="img" aria-label="ICSphere, RTU Institute of Computer Studies">
          <div class="boot-brand-shimmer">
            <span class="boot-wordmark"><img src="/brand/icsphere-wordmark.png" alt="" width="2048" height="683" fetchpriority="high" /></span>
            <p>RTU Institute of Computer Studies</p>
          </div>
        </div>
        <p data-boot-message>Loading your student portal...</p>
        <button type="button" hidden>Reload ICSphere</button>
        <noscript><p>JavaScript is required to use ICSphere. Enable it in your browser and reload this page.</p></noscript>
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
