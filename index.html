<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme.js"></script>
    <style>
      .boot-splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; padding: 32px; text-align: center; background: var(--background, Canvas); color: var(--foreground, CanvasText); font-family: var(--font-family-sans, system-ui, sans-serif); opacity: 1; transition: opacity 180ms ease; }
      .boot-splash strong { font-size: 30px; font-weight: 600; line-height: 1.2; }
      .boot-splash p { max-width: 360px; margin: 16px auto 0; font-size: 14px; line-height: 1.6; color: var(--muted-foreground, CanvasText); }
      .boot-loader { position: relative; width: 96px; height: 3px; margin: 28px auto 0; overflow: hidden; border-radius: 8px; background: var(--border, ButtonFace); }
      .boot-loader::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: var(--primary, Highlight); animation: boot-loading 1200ms ease-in-out infinite; }
      @keyframes boot-loading { from { transform: translateX(-110%); } to { transform: translateX(360%); } }
      .boot-splash-ready { opacity: 0; }
      .boot-splash button { margin: 24px auto 0; padding: 8px 16px; border: 1px solid var(--border, CanvasText); border-radius: 8px; background: var(--surface, Canvas); color: var(--foreground, CanvasText); font: inherit; cursor: pointer; }
      .boot-splash button:focus-visible { outline: 2px solid var(--primary, Highlight); outline-offset: 4px; }
      @media (prefers-reduced-motion: reduce) { .boot-splash { transition: none; } .boot-loader::after { animation: none; width: 100%; } }
    </style>
    <script src="/boot.js"></script>
    <meta name="description" content="ICSphere is a student-developed academic portal for RTU ICS BSIT students, bringing schedules, department updates, and academic guidance together." />
    <title>ICSphere — Student portal</title>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-live="polite"><strong>ICSphere</strong><p data-boot-message>Loading your student portal...</p><div class="boot-loader" aria-hidden="true"></div><button type="button" hidden>Reload ICSphere</button><noscript><p>JavaScript is required to use ICSphere. Enable it in your browser and reload this page.</p></noscript></div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
